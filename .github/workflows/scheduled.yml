name: Scheduled hardening

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      dedicated_benchmarks:
        description: Run full matrices on labeled self-hosted benchmark machines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scheduled-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-safety:
    name: safety (${{ matrix.platform }}, ${{ matrix.rmw_label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # Keep the active phase on Jazzy/Cyclone. Other RMWs return only after
        # compatibility, native optimization, and benchmark gates are complete.
        include:
          - runner: ubuntu-24.04
            platform: linux-64
            machine: x86_64
            rmw: rmw_cyclonedds_cpp
            rmw_label: cyclone
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            machine: aarch64
            rmw: rmw_cyclonedds_cpp
            rmw_label: cyclone
    env:
      MAKE_NPROCS: '2'
      STDCXX: '17'
      RCLCPPYY_SUITE_SRC: ${{ github.workspace }}/_deps/cppyy_kit
      PYTHONPATH: ${{ github.workspace }}/_deps/cppyy_kit:${{ github.workspace }}/_deps/cppyy_kit/rclcpp_kit
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Checkout pinned kit sources
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: awesomebytes/cppyy_kit
          ref: 27de09338969c5eff2d8698b37fd7954aca9c12c
          path: _deps/cppyy_kit
      - name: Verify architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.0
          environments: default
          cache: true
          cache-key: scheduled-${{ matrix.platform }}-${{ matrix.rmw_label }}-
          cache-write: false
      - name: Validate source and compatibility manifest
        run: |
          mkdir -p build/scheduled
          pixi run suite-contract | tee build/scheduled/suite-source.json
          pixi run lint
          pixi run contract
      - name: Run full contract for this RMW
        run: |
          set -euo pipefail
          mkdir -p build/scheduled
          pixi run env RMW_IMPLEMENTATION="${{ matrix.rmw }}" pytest test/ -v -ra \
            --junitxml="build/scheduled/${{ matrix.rmw }}.xml"
      - name: Run paced publisher-C++ churn and concurrent publisher soak
        run: |
          set -euo pipefail
          pixi run env RMW_IMPLEMENTATION="${{ matrix.rmw }}" \
            python scripts/ci/stress_runtime.py \
            --profile publisher_cpp \
            --repetitions 3 --signal-repetitions 0 \
            --round-period-seconds 15 \
            --min-duration-seconds 900 --max-rss-growth-kib 262144 \
            --output "build/scheduled/stress-${{ matrix.rmw }}.json" \
            2>&1 | tee "build/scheduled/stress-${{ matrix.rmw }}.log"
      - name: Measure equal-work stock memory
        run: |
          set -euo pipefail
          pixi run env RMW_IMPLEMENTATION="${{ matrix.rmw }}" \
            python scripts/ci/stress_runtime.py \
            --profile stock --cycles 100 --repetitions 50 \
            --signal-repetitions 0 --min-duration-seconds 0 \
            --output build/scheduled/memory-stock.json \
            2>&1 | tee build/scheduled/memory-stock.log
      - name: Measure equal-work compatible memory
        run: |
          set -euo pipefail
          pixi run env RMW_IMPLEMENTATION="${{ matrix.rmw }}" \
            python scripts/ci/stress_runtime.py \
            --profile compatible --cycles 100 --repetitions 50 \
            --signal-repetitions 0 --min-duration-seconds 0 \
            --output build/scheduled/memory-compatible.json \
            2>&1 | tee build/scheduled/memory-compatible.log
      - name: Guard compatible memory against unbounded growth
        run: |
          pixi run python scripts/ci/compare_stress_memory.py \
            build/scheduled/memory-stock.json \
            build/scheduled/memory-compatible.json \
            --minimum-cycles 4900 \
            --max-relative-slope 1.75 \
            --max-absolute-delta-kib-per-1000-cycles 2048 \
            --output build/scheduled/memory-comparison.json
      - name: Gate optimized immediate signal boundary
        run: |
          pixi run env RMW_IMPLEMENTATION="${{ matrix.rmw }}" \
            python scripts/ci/stress_runtime.py \
            --signal-only --profile optimized \
            --signal-settle-seconds 0 --signal-repetitions 50 \
            --output build/scheduled/signal-optimized-boundary.json \
            2>&1 | tee build/scheduled/signal-optimized-boundary.log
      - name: Record compatible settled signal diagnostic
        continue-on-error: true
        run: |
          pixi run env RMW_IMPLEMENTATION="${{ matrix.rmw }}" \
            python scripts/ci/stress_runtime.py \
            --signal-only --profile compatible \
            --signal-settle-seconds 0.05 --signal-repetitions 50 \
            --output build/scheduled/signal-compatible-settled.json \
            2>&1 | tee build/scheduled/signal-compatible-settled.log
      - name: Record stock immediate signal boundary diagnostic
        continue-on-error: true
        run: |
          pixi run env RMW_IMPLEMENTATION="${{ matrix.rmw }}" \
            python scripts/ci/stress_runtime.py \
            --signal-only --profile stock \
            --signal-settle-seconds 0 --signal-repetitions 50 \
            --output build/scheduled/signal-stock-boundary.json \
            2>&1 | tee build/scheduled/signal-stock-boundary.log
      - name: Prove isolated cold, warm, and corrupt generated caches
        if: ${{ always() && matrix.rmw == 'rmw_cyclonedds_cpp' }}
        run: |
          set -euo pipefail
          cache_root="$RUNNER_TEMP/rclcppyy-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.platform }}"
          test ! -e "$cache_root"
          pixi run python scripts/ci/prove_generated_cache.py \
            --cache-root "$cache_root" \
            --output build/scheduled/generated-cache.json \
            2>&1 | tee build/scheduled/generated-cache.log
          CPPYY_KIT_CACHE_DIR="$cache_root/corrupt" \
            pixi run pytest \
              _deps/cppyy_kit/cppyy_kit/tests/test_cache.py::test_corrupt_cache_recovers \
              -q 2>&1 | tee build/scheduled/cache-corrupt-recovery.log
      - name: Upload scheduled evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-${{ matrix.platform }}-${{ matrix.rmw_label }}
          path: build/scheduled
          if-no-files-found: error
          retention-days: 30

  dedicated-benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dedicated_benchmarks }}
    name: dedicated benchmark (${{ matrix.machine }})
    runs-on: [self-hosted, linux, benchmark, '${{ matrix.machine }}']
    timeout-minutes: 240
    env:
      RCLCPPYY_SUITE_SRC: ${{ github.workspace }}/_deps/cppyy_kit
      PYTHONPATH: ${{ github.workspace }}/_deps/cppyy_kit:${{ github.workspace }}/_deps/cppyy_kit/rclcpp_kit
      CPPYY_KIT_NO_AUTOPCH: '1'
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache/rclcppyy-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.machine }}
    strategy:
      fail-fast: false
      matrix:
        machine: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Checkout pinned kit sources
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: awesomebytes/cppyy_kit
          ref: 27de09338969c5eff2d8698b37fd7954aca9c12c
          path: _deps/cppyy_kit
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.0
          environments: default
          cache: false
      - name: Verify architecture and suite source identity
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          mkdir -p build/dedicated-benchmark
          pixi run suite-contract | tee build/dedicated-benchmark/suite-source.json
      - name: Record machine controls
        run: |
          mkdir -p build/dedicated-benchmark
          uname -a | tee build/dedicated-benchmark/machine.txt
          lscpu | tee -a build/dedicated-benchmark/machine.txt
          cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor \
            | tee -a build/dedicated-benchmark/machine.txt || true
      - name: Establish deterministic generated-cache state
        run: |
          set -euo pipefail
          test ! -e "$XDG_CACHE_HOME"
          pixi run python scripts/ci/prove_generated_cache.py \
            --cache-root "$XDG_CACHE_HOME" \
            --output build/dedicated-benchmark/generated-cache.json \
            2>&1 | tee build/dedicated-benchmark/generated-cache.log
      - name: Run repeated raw matrices
        run: |
          set -euo pipefail
          for repeat in 1 2 3 4 5; do
            pixi run bench \
              --backends rclpy,rclcppyy,rclcppyy-templated,rclcppyy-direct-copy,rclcppyy-direct-lease \
              --workloads small-string,nested-header --rate 1000,10000 \
              --payload-bytes 0,4096 --duration 15 \
              --output "build/dedicated-benchmark/run-${repeat}.json"
          done
      - name: Run controlled Jazzy Cyclone seven-lane entity matrices
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          set -euo pipefail
          pixi run relay-boundary-bench \
            --output build/dedicated-benchmark/relay-boundary.json
          pixi run service-callback-bench \
            --output build/dedicated-benchmark/service-callback.json
          pixi run service-client-bench \
            --output build/dedicated-benchmark/service-client.json
          pixi run timer-executor-bench \
            --output build/dedicated-benchmark/timer-executor.json
          pixi run action-client-bench \
            --output build/dedicated-benchmark/action-client.json
          pixi run action-server-bench \
            --output build/dedicated-benchmark/action-server.json
          pixi run local-parameter-bench \
            --output build/dedicated-benchmark/local-parameter.json
          pixi run remote-parameter-bench \
            --output build/dedicated-benchmark/remote-parameter.json
          pixi run fusion-pipeline-bench \
            --output build/dedicated-benchmark/fusion-pipeline.json
      - name: Gate repeated results against reviewed architecture budget
        run: |
          pixi run bench-regression \
            --budget "benchmarks/regression-budgets/${{ matrix.machine }}.json" \
            --output build/dedicated-benchmark/regression.json \
            build/dedicated-benchmark/run-{1,2,3,4,5}.json
      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ matrix.machine }}-${{ github.sha }}
          path: build/dedicated-benchmark
          if-no-files-found: error
          retention-days: 90
