name: CI

# Keep push and pull request feedback focused on source build, safety checks,
# and representative runtime behavior on both supported architectures. The
# full suite and package proof run on release; upstream contracts, hardening,
# and benchmark matrices run in the scheduled/manual workflow.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch-protection required checks are exactly:
  # `fast source smoke (linux-64)` and `fast source smoke (linux-aarch64)`.
  smoke:
    name: fast source smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      MAKE_NPROCS: '2'
      STDCXX: '17'
      RCLCPPYY_SUITE_SRC: ${{ github.workspace }}/_deps/cppyy_kit
      PYTHONPATH: ${{ github.workspace }}/_deps/cppyy_kit:${{ github.workspace }}/_deps/cppyy_kit/rclcpp_kit
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            machine: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout pinned kit sources
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: awesomebytes/cppyy_kit
          ref: 6260ef0ab0c146951399441bbfdbae7a0f116e3a
          path: _deps/cppyy_kit

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.0
          environments: default
          cache: true
          cache-key: rclcppyy-${{ matrix.platform }}-
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Verify pinned suite source identity
        run: pixi run suite-contract

      - name: Restore generated C++ cache
        id: generated-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/cppyy_kit
          key: generated-cppyy-kit-${{ matrix.platform }}-${{ hashFiles('pixi.lock') }}

      - name: Build source
        run: pixi run build

      - name: Verify API ledger drift (x86 only)
        if: matrix.platform == 'linux-64'
        run: pixi run ledger-verify

      - name: Lint and validate compatibility contract
        run: |
          pixi run lint
          pixi run contract

      - name: Run focused runtime smoke tests
        run: pixi run test-ci-fast

      - name: Save generated C++ cache
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.generated-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/cppyy_kit
          key: generated-cppyy-kit-${{ matrix.platform }}-${{ hashFiles('pixi.lock') }}
