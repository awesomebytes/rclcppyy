name: Release

# On a version tag (v*): build the ros-jazzy-rclcppyy conda package, prove the
# artifact installs and runs from a channel with no repo checkout, then upload
# it to the prefix.dev channel.
#
# Authentication: OIDC trusted publishing (no API token stored anywhere).
# prefix.dev → channel `awesomebytes` → Repository Access authorizes
# awesomebytes/rclcppyy, workflow release.yml, with read/write. The
# `id-token: write` permission below lets the job mint the GitHub OIDC token
# that rattler-build exchanges automatically during `upload prefix`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: source preflight (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      MAKE_NPROCS: "2"
      STDCXX: "17"
      RCLCPPYY_SUITE_SRC: ${{ github.workspace }}/_deps/cppyy_kit
      RCLPY_CONTRACT_SRC: ${{ github.workspace }}/_deps/rclpy-contract
      PYTHONPATH: ${{ github.workspace }}/_deps/cppyy_kit:${{ github.workspace }}/_deps/cppyy_kit/rclcpp_kit
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            machine: aarch64
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@v5

      - name: Checkout pinned kit sources
        uses: actions/checkout@v5
        with:
          repository: awesomebytes/cppyy_kit
          ref: 6a89d92484afbe540f7fb56bbb5d183ae252c995
          path: _deps/cppyy_kit

      - name: Checkout pinned upstream contract source
        uses: actions/checkout@v5
        with:
          repository: ros2/rclpy
          ref: baf9d72cfa127e391a89b4ab51ba9e55c37041fd
          path: _deps/rclpy-contract

      - name: Verify tag and runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          python3 scripts/ci/verify_release_version.py "${GITHUB_REF_NAME}"

      - name: Set up source-test environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.0
          environments: default
          cache: true
          cache-key: release-preflight-${{ matrix.platform }}-
          cache-write: false

      - name: Verify exact suite source and build
        run: |
          mkdir -p build/release-preflight
          pixi run suite-contract | tee build/release-preflight/suite-source.json
          pixi run build

      - name: Run compatibility and integration gates
        run: |
          set -euo pipefail
          pixi run lint
          pixi run contract
          pixi run launch-contract
          pixi run custom-interfaces
          pixi run test-ci

      - name: Run reviewed upstream contracts
        run: |
          pixi run -e upstream-contract upstream-contract
          pixi run -e upstream-contract upstream-content-filter-contract

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            build/release-preflight
            build/test-results
          if-no-files-found: error
          retention-days: 90

  release:
    name: build, prove artifact, upload
    needs: preflight
    runs-on: ubuntu-latest
    env:
      RCLCPPYY_SUITE_SRC: ${{ github.workspace }}/_deps/cppyy_kit
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pinned kit sources
        uses: actions/checkout@v5
        with:
          repository: awesomebytes/cppyy_kit
          ref: 6a89d92484afbe540f7fb56bbb5d183ae252c995
          path: _deps/cppyy_kit

      - name: Verify tag matches all release metadata
        run: python3 scripts/ci/verify_release_version.py "${GITHUB_REF_NAME}"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.0
          # Only the packaging env; it doesn't pull the ROS/cppyy stack.
          environments: pkg

      # Build the complete local stack from immutable archives. This binds the product
      # proof to suite-source.lock.json instead of trusting only a matching package
      # version from a mutable channel.
      - name: Build exact locked conda stack
        run: |
          pixi run -e pkg bash scripts/ci/build_local_package_stack.sh \
            _deps/cppyy_kit output

      - name: Identify the release artifact
        id: artifact
        run: |
          set -euo pipefail
          mkdir -p build/release
          mapfile -t artifacts < <(
            find output -type f -name 'ros-jazzy-rclcppyy-*.conda' | sort
          )
          test "${#artifacts[@]}" -eq 1
          printf 'path=%s\n' "${artifacts[0]}" >> "$GITHUB_OUTPUT"
          sha256sum "${artifacts[0]}" | tee build/release/SHA256SUMS
          cp output/local-package-attestation.json build/release/

      # The point of releasing: a user with no clone gets a working install from
      # the channel alone, including the same-handle serialized publisher route.
      - name: Prove the artifact installs and runs from a channel
        run: |
          set -o pipefail
          scripts/ci/prove_rclcppyy_package.sh output 2>&1 \
            | tee build/release/package-proof.log

      - name: Generate SPDX SBOM from the release artifact
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ${{ steps.artifact.outputs.path }}
          format: spdx-json
          output-file: build/release/rclcppyy.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}

      - name: Attest release SBOM
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}
          sbom-path: build/release/rclcppyy.spdx.json

      - name: Preserve portable attestation bundles
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            build/release/provenance.sigstore.json
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            build/release/sbom.sigstore.json

      - name: Upload release gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            build/release
            compatibility/jazzy.json
            compatibility/manifest.schema.json
            schemas/benchmark-v2.schema.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload to the prefix.dev channel `awesomebytes` (OIDC)
        run: |
          set -euxo pipefail
          pixi run -e pkg rattler-build upload prefix --channel awesomebytes \
            "${{ steps.artifact.outputs.path }}"
