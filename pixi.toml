[workspace]
authors = ["Sam Pfeiffer <sammypfeiffer@gmail.com>"]
name = "rclcppyy_ws"
channels = ["https://repo.prefix.dev/awesomebytes", "robostack-jazzy", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
version = "0.3.0"

[dependencies]
ros-jazzy-ros-base = ">=0.11"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-rmw-fastrtps-cpp = "*"
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
make = "*"
compilers = "*"
pkg-config = "*"
python = "3.12.*"
# robostack-jazzy's launch_testing / launch_ros pytest plugins use hook
# signatures removed in pytest 8, so keep pytest on the 7.x line.
pytest = ">=7.4,<8"
numpy = "*"
setuptools = "<81"
psutil = ">=7.2.2,<8"
# M3: rclcppyy's rclcpp core + cppyy kits were carved into the cppyy_kit suite
# (rclcpp_kit / cppyy_kit). rclcppyy re-exports them via deprecation shims, so both
# must be IMPORTABLE at runtime. The suite is now published to prefix.dev
# (awesomebytes channel, added above), so these are real conda deps pinned to the
# last published version. The release recipe already requires suite 0.2.0; the
# focused packaging task builds that strict dependency stack from the sibling
# source checkout until 0.2.0 is published. See RELEASING.md.

# cppyy 3.5 and the published kit artifacts are available together on x86-64.
[target.linux-64.dependencies]
cppyy = ">=3.5,<4"
ros-jazzy-rclcpp-kit = "==0.1.0"
cppyy-kit = "==0.1.0"

# ARM64 source tests retain the exact small upstream Python shim while every
# compiled component comes from conda-forge. The package lane separately builds
# and installs the top-level ARM64 conda bridge from the pinned suite source.
[target.linux-aarch64.dependencies]
cpycppyy = "==1.13.0"
cppyy-backend = "==1.15.3"
cppyy-cling = "==6.32.8"

[target.linux-aarch64.pypi-dependencies]
cppyy = "==3.5.0"

[activation]
scripts = ["workspace_activation.sh"]

[activation.env]
# fastrtps (the ROS default) has intermittent latency issues and drops big
# messages; cyclonedds on LOCALHOST is the reliable default for this workspace.
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
# cppyy resolves C++ symbols at call time by scanning LD_LIBRARY_PATH for the
# owning shared library (e.g. librclcpp.so). conda/robostack rely on RPATH and
# leave LD_LIBRARY_PATH unset, so without this cppyy.gbl.rclcpp calls fail with
# "failed to resolve function". Point it at the env's lib dir.
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[tasks]
build = "colcon build --packages-select rclcppyy"
clean = "rm -rf build install log"
test = "pytest test/"
test-ci = "pytest test/ -v -ra --junitxml=build/test-results/pytest.xml"
suite-contract = "python scripts/ci/verify_suite_source.py --json"
custom-interfaces = "bash scripts/ci/prove_custom_interfaces.sh"
launch-contract = "bash scripts/ci/prove_launch_cli.sh"
scan-acceleration = "python skills/rclcppyy-accelerate/scripts/scan_project.py"
rewrite-evidence = "python skills/rclcppyy-accelerate/fixtures/rewrite_projects/evidence_protocol.py --output build/rewrite-fixture-evidence.json"
lint = "flake8 rclcppyy test launch/hook_probe.launch.py scripts/check_compatibility_manifest.py scripts/ci/hook_launch_probe.py scripts/ci/stress_runtime.py scripts/ci/compare_stress_memory.py scripts/ci/prove_generated_cache.py scripts/ci/verify_suite_source.py scripts/ci/verify_release_version.py scripts/ci/build_release_inventory.py scripts/ci/verify_published_support.py scripts/ci/verify_release_matrix.py scripts/ci/verify_product_upload.py scripts/ci/run_upstream_rclpy_contract.py scripts/ci/write_local_package_attestation.py skills/rclcppyy-accelerate/scripts/scan_project.py skills/rclcppyy-accelerate/fixtures/rewrite_projects test/fixtures/custom_interfaces/run_interop.py scripts/benchmarks/_result_schema.py scripts/benchmarks/_backend_marker.py scripts/benchmarks/_benchmark_matrix.py scripts/benchmarks/_benchmark_protocol.py scripts/benchmarks/_boundary_protocol.py scripts/benchmarks/_domain_lease.py scripts/benchmarks/_relay_boundary_protocol.py scripts/benchmarks/_service_callback_protocol.py scripts/benchmarks/_timer_executor_protocol.py scripts/benchmarks/bench_worker.py scripts/benchmarks/boundary_worker.py scripts/benchmarks/relay_boundary_worker.py scripts/benchmarks/service_callback_worker.py scripts/benchmarks/timer_executor_worker.py scripts/benchmarks/run_benchmarks.py scripts/benchmarks/run_boundary_benchmark.py scripts/benchmarks/run_relay_boundary_benchmark.py scripts/benchmarks/run_service_callback_benchmark.py scripts/benchmarks/run_timer_executor_benchmark.py scripts/benchmarks/render_report.py scripts/benchmarks/compare_regressions.py scripts/benchmarks/analyze_compatibility_evidence.py scripts/benchmarks/bench_pub_rclpy.py scripts/benchmarks/bench_sub_rclpy.py scripts/benchmarks/bench_pub_rclcppyy_monkeypatch.py scripts/benchmarks/bench_sub_rclcppyy_monkeypatched.py scripts/benchmarks/bench_pub_rclcppyy.py scripts/benchmarks/bench_sub_rclcppyy.py"
contract = "python scripts/check_compatibility_manifest.py compatibility/jazzy.json"
# rclpy-vs-rclcppyy CPU comparison in one command (default: 1 kHz + 10 kHz).
# Extra flags pass straight through, e.g. `pixi run bench --rate 5000 --duration 10`.
bench = "python scripts/benchmarks/run_benchmarks.py"
bench-report = "python scripts/benchmarks/render_report.py"
bench-regression = "python scripts/benchmarks/compare_regressions.py"
bench-compatibility-evidence = "python scripts/benchmarks/analyze_compatibility_evidence.py"
boundary-bench = "python scripts/benchmarks/run_boundary_benchmark.py"
relay-boundary-bench = "python scripts/benchmarks/run_relay_boundary_benchmark.py"
service-callback-bench = "python scripts/benchmarks/run_service_callback_benchmark.py"
timer-executor-bench = "python scripts/benchmarks/run_timer_executor_benchmark.py"
# The rclpy publisher/subscriber tutorial, running on the rclcppyy C++ backend.
demo-tutorial = "python scripts/ros_tutorials/publisher_member_function.py"
# One-command live pub/sub demo (rclcppyy monkeypatched backend).
demo-pubsub = "python scripts/benchmarks/run_benchmarks.py --demo"

# Optional "demos" feature/environment: heavy extras used only by the example
# scripts under scripts/big_messages_demos/ and roscon_uk_2025/. Kept out of the
# default env so a plain `pixi install` stays lean. Enable with `pixi install -e
# demos` and run the tasks with `pixi run -e demos <task>`.
[feature.demos.dependencies]
opencv = "*"                    # cv2 for the image demo
ros-jazzy-pcl-conversions = "*" # pcl <-> sensor_msgs/PointCloud2 bridge (headers)
pcl = "*"                       # Point Cloud Library headers (voxelgrid demo)
eigen = "*"                     # PCL/pcl_conversions dependency (eigen3 headers)
gstreamer = "*"                 # gstreamer demo pipeline
gst-plugins-base = "*"          # videoconvert / appsrc / appsink elements
gst-plugins-good = "*"          # v4l2src / autovideosink elements
pygobject = "*"                 # the `gi` bindings (gi.repository.Gst)
typer = "*"                     # CLI wrapper used by the gstreamer / cloudini demos
hypothesis = "*"                # property-based testing demo

[feature.demos.tasks]
# Publishes a real JPEG as a sensor_msgs/Image at 4 Hz via the rclcppyy C++
# backend (loads the image relative to the script, prints its size on startup).
demo-images = "python scripts/big_messages_demos/demo_images.py"
# Property-based testing of a JIT-compiled C++ function with Hypothesis. Runs
# to completion on its own.
demo-hypothesis = "python roscon_uk_2025/presentation/5_hypothesis_test.py"
# PCL VoxelGrid downsampling node. JIT-compiles the pcl/pcl_conversions kernel
# on startup (the interesting part), then waits for PointCloud2 messages on
# /lexus3/os_center/points — needs an external bag to produce output.
demo-pointcloud-voxelgrid = "python roscon_uk_2025/presentation/2_pointcloud_voxelgrid.py"

# Optional "heavydemo" feature/environment: the heavy-topic `ros2 topic hz`
# showcase (scripts/heavy_hz_demo/). It reuses the default ROS/cppyy stack
# (solve-group "default", no extra conda deps) but bridges rclcpp_kit/cppyy_kit
# from a sibling *source* checkout, because the cold-vs-warm startup story needs
# the zero-config auto-PCH that postdates the published suite 0.1.0 the default
# env pins. The bridge is DEV/demo-only and gated on CPPYY_KIT_SRC (see
# workspace_activation.sh); the default env's published-channel dependency is
# untouched. Run with `pixi run -e heavydemo demo-heavy-hz` (see README).
[feature.heavydemo.activation.env]
# Isolate the auto-PCH cache to a repo-local (gitignored) dir so the demo never
# reads or writes the shared ~/.cache/cppyy_kit, and the startup-story runner can
# clear it to force a cold run. (The checkout path the bridge exposes on
# PYTHONPATH is chosen in workspace_activation.sh, gated on PIXI_ENVIRONMENT_NAME;
# override it with `CPPYY_KIT_SRC=/path pixi run -e heavydemo ...`.)
XDG_CACHE_HOME = "$PIXI_PROJECT_ROOT/.heavy_demo_cache"

[feature.heavydemo.tasks]
# rclpy vs rclcppyy hz comparison on a heavy topic (the headline table).
demo-heavy-hz = "python scripts/heavy_hz_demo/run_heavy_hz.py --compare"
# The same comparison split into the two variants the README shows side by side.
demo-heavy-hz-rclpy = "python scripts/heavy_hz_demo/run_heavy_hz.py --variant rclpy"
demo-heavy-hz-rclcppyy = "python scripts/heavy_hz_demo/run_heavy_hz.py --variant rclcppyy"
# Cold (fresh PCH cache) vs warm rclcppyy bringup: parse cost + time-to-first-msg.
demo-heavy-startup = "python scripts/heavy_hz_demo/run_heavy_hz.py --startup-story"
# Accelerate the REAL `ros2 topic hz` binary via RCLCPPYY_ENABLE_HOOK: rclpy vs
# rclcppyy CPU/hz on a 3 MB image (installs the opt-in .pth first; idempotent).
# Vary payload/rate with flags, e.g. --width 128 --height 128 --rates 1000,3000.
demo-topic-hz-cli = "python scripts/heavy_hz_demo/run_topic_hz_cli.py --sweep --rates 100,200,300 --width 1024 --height 1024 --reliability best_effort"
# Time-to-first-hz-line of the real `ros2 topic hz`: stock vs RCLCPPYY_ENABLE_HOOK, cold vs warm.
demo-topic-hz-startup = "python scripts/heavy_hz_demo/run_topic_hz_cli.py --startup-story"

# Optional "pkg" feature/environment: tooling to build the conda package from
# recipe/. Standalone (no default ROS/cppyy stack), so it stays lean and doesn't
# perturb the default env's lock.
[feature.pkg.dependencies]
rattler-build = ">=0.68,<0.69"
python = "3.12.*"

[feature.pkg.tasks]
# Build the suite core and rclcppyy into one local channel, then run each
# recipe's isolated import test. CPPYY_KIT_SRC can select another suite checkout.
pkg-build = "bash scripts/ci/build_local_package_stack.sh"

# Optional upstream contract environment. The production/default dependency
# surface stays unchanged; test_msgs is needed only by the reviewed upstream
# rclpy tests selected in compatibility/upstream-rclpy-contract.json.
[feature.upstream-contract.dependencies]
ros-jazzy-test-msgs = "*"

[feature.upstream-contract.tasks]
upstream-contract = "python scripts/ci/run_upstream_rclpy_contract.py"
upstream-contract-validate = "python scripts/ci/run_upstream_rclpy_contract.py --validate-only"
upstream-content-filter-contract = "python scripts/ci/run_upstream_rclpy_contract.py --only-path test_subscription.py --rmw-implementation rmw_fastrtps_cpp --require-no-skips --evidence-dir build/test-results/upstream-rclpy-fastrtps"

[environments]
# solve-group = "default" pins the shared ROS/cppyy stack to the default env's
# versions, so enabling `demos` never re-resolves it. The kit spike envs
# (bt/pcl/ompl/nav2/moveit/control/vision/cudabuild) moved to the cppyy_kit repo
# with the kits themselves (M3 cleanup); only the product's own demos + packaging
# envs remain here.
demos = { features = ["demos"], solve-group = "default" }
# heavydemo shares the default solve so enabling it never re-resolves the stack;
# it adds no conda deps, only the demo bridge activation env + tasks.
heavydemo = { features = ["heavydemo"], solve-group = "default" }
# no-default-feature: the packaging tooling doesn't need the ROS/cppyy stack.
pkg = { features = ["pkg"], no-default-feature = true }
upstream-contract = { features = ["upstream-contract"], solve-group = "default" }
